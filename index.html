<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<meta name="description" content="EnglishRush — твой персональный тренажёр английских слов.">
<title>EnglishRush</title>

<style>
:root {
    color-scheme: dark;
    --bg: #101114;
    --panel: #191a1f;
    --panel2: #202127;
    --panel3: #272830;
    --orange: #ff8a24;
    --orange2: #ffab52;
    --text: #f7f7f8;
    --muted: #9698a2;
    --border: rgba(255,255,255,.065);
    --green: #5ed5a0;
    --red: #ff7777;
    --radius: 23px;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
}

button, input, textarea { font: inherit; }
button { cursor: pointer; }

button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--orange);
    outline-offset: 3px;
}

.app {
    min-height: 100vh;
    display: flex;
}

.sidebar {
    width: 252px;
    position: fixed;
    inset: 0 auto 0 0;
    background: #15161a;
    border-right: 1px solid var(--border);
    padding: 30px 19px;
    display: flex;
    flex-direction: column;
    z-index: 5;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 4px 9px 35px;
}

.brand-icon {
    width: 43px;
    height: 43px;
    border-radius: 15px;
    background: linear-gradient(145deg,#ffad57,#f36a12);
    display: grid;
    place-items: center;
    color: #21140b;
    font-size: 22px;
    font-weight: 1000;
    box-shadow: 0 7px 22px #ff861d36;
}

.brand-name {
    font-size: 21px;
    font-weight: 900;
    letter-spacing: -.8px;
}

.brand-name span { color: var(--orange); }

.nav-label {
    color: #6f717c;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.5px;
    padding: 0 12px;
    margin: 7px 0 13px;
}

.nav {
    display: grid;
    gap: 8px;
}

.nav-btn {
    display: flex;
    align-items: center;
    gap: 13px;
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 15px;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    font-weight: 750;
    text-align: left;
    transition: .2s ease;
}

.nav-btn:hover { background: #ffffff09; color: white; }
.nav-btn.active {
    background: #ff8a2418;
    color: var(--orange2);
}

.nav-icon { width: 22px; text-align: center; font-size: 19px; }

.sidebar-bottom {
    margin-top: auto;
    padding: 17px 13px;
    border: 1px solid var(--border);
    border-radius: 17px;
    background: #ffffff04;
}

.sidebar-bottom strong { font-size: 13px; }
.sidebar-bottom p {
    margin: 7px 0 0;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.6;
}

.main {
    width: calc(100% - 252px);
    max-width: 1500px;
    margin-left: 252px;
    padding: 31px 43px 65px;
}

.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 32px;
}

.topbar-label {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 5px;
}

.topbar h1 {
    font-size: 25px;
    letter-spacing: -.8px;
    margin: 0;
    font-weight: 850;
}

.local-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    border-radius: 30px;
    font-size: 11px;
    white-space: nowrap;
}

.local-dot {
    width: 7px;
    height: 7px;
    background: var(--green);
    border-radius: 50%;
}

.view { animation: appear .25s ease; }

@keyframes appear {
    from { opacity: 0; transform: translateY(7px); }
    to { opacity: 1; transform: translateY(0); }
}

.hero {
    position: relative;
    overflow: hidden;
    min-height: 245px;
    padding: 34px;
    border-radius: 28px;
    background:
        radial-gradient(ellipse at 90% 20%,#ff982d36,transparent 42%),
        linear-gradient(120deg,#332017,#211a18 65%,#241a15);
    border: 1px solid #ff9a3626;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 25px;
}

.hero-content { position: relative; z-index: 1; max-width: 530px; }

.eyebrow {
    color: var(--orange2);
    font-size: 11px;
    letter-spacing: 1.5px;
    font-weight: 900;
    text-transform: uppercase;
}

.hero h2 {
    margin: 13px 0 10px;
    font-size: clamp(28px,4vw,41px);
    line-height: 1.12;
    letter-spacing: -1.5px;
    font-weight: 950;
}

.hero h2 span { color: var(--orange); }

.hero p {
    max-width: 390px;
    color: #c6b7ae;
    font-size: 13px;
    line-height: 1.7;
    margin: 0 0 23px;
}

.hero-decoration {
    font-size: 110px;
    opacity: .92;
    filter: drop-shadow(0 14px 20px #0006);
    transform: rotate(-9deg);
    margin-right: 35px;
    animation: float 4s ease-in-out infinite;
}

@keyframes float {
    0%,100% { transform: translateY(0) rotate(-9deg); }
    50% { transform: translateY(-9px) rotate(-5deg); }
}

.primary-btn, .secondary-btn, .danger-btn {
    border: 0;
    border-radius: 15px;
    padding: 13px 19px;
    font-size: 13px;
    font-weight: 850;
    transition: transform .15s ease, filter .15s ease;
}

.primary-btn {
    background: linear-gradient(135deg,#ffad51,#ff7919);
    color: #241408;
    box-shadow: 0 7px 20px #ff832b24;
}

.primary-btn:hover { filter: brightness(1.08); transform: translateY(-2px); }
.primary-btn:active, .secondary-btn:active { transform: scale(.97); }

.secondary-btn {
    background: var(--panel3);
    border: 1px solid var(--border);
    color: var(--text);
}

.secondary-btn:hover { background: #33343d; }

.danger-btn {
    background: #ff5f5f16;
    color: #ff9292;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3,minmax(0,1fr));
    gap: 15px;
    margin: 23px 0 30px;
}

.stat-card {
    padding: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 21px;
    transition: .2s;
}

.stat-card:hover { transform: translateY(-3px); border-color: #ff8a2440; }

.stat-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.stat-icon {
    width: 37px;
    height: 37px;
    display: grid;
    place-items: center;
    border-radius: 13px;
    background: #ff92221a;
    font-size: 17px;
}

.stat-number {
    font-size: 30px;
    font-weight: 950;
    letter-spacing: -1px;
    margin-top: 13px;
}

.stat-label { color: var(--muted); font-size: 12px; margin-top: 3px; }

.section-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin: 29px 0 16px;
}

.section-heading h2 {
    font-size: 18px;
    font-weight: 850;
    margin: 0;
    letter-spacing: -.5px;
}

.section-heading p { color: var(--muted); font-size: 11px; margin: 5px 0 0; }

.task-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill,minmax(245px,1fr));
    gap: 15px;
}

.task-card {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 20px;
    border-radius: 21px;
    cursor: pointer;
    transition: .2s ease;
    min-width: 0;
}

.task-card:hover {
    border-color: #ff8a2466;
    transform: translateY(-3px);
    background: #1d1e23;
}

.task-card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}

.task-symbol {
    width: 43px;
    height: 43px;
    border-radius: 15px;
    background: #ff90221b;
    display: grid;
    place-items: center;
    font-size: 20px;
}

.task-card h3 {
    margin: 15px 0 5px;
    font-size: 16px;
    font-weight: 850;
}

.task-card p {
    color: var(--muted);
    font-size: 11px;
    margin: 0;
    line-height: 1.6;
}

.task-card-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
}

.task-count { color: var(--orange2); font-weight: 850; }

.empty {
    text-align: center;
    background: var(--panel);
    border: 1px dashed #ffffff1a;
    padding: 40px 20px;
    border-radius: 22px;
    grid-column: 1/-1;
}

.empty-icon { font-size: 39px; margin-bottom: 11px; }
.empty h3 { font-size: 16px; margin: 0 0 8px; }
.empty p {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.6;
    max-width: 330px;
    margin: 0 auto 18px;
}

.detail-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 15px;
    margin-bottom: 20px;
}

.detail-header h2 { font-size: 25px; margin: 11px 0 5px; }
.detail-header p { color: var(--muted); font-size: 12px; margin: 0; }

.back-btn {
    color: var(--muted);
    border: 0;
    background: none;
    padding: 5px 0;
    font-size: 12px;
    font-weight: 750;
}

.back-btn:hover { color: var(--orange); }

.word-list { display: grid; gap: 10px; }

.word-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 17px;
    min-width: 0;
}

.word-main { min-width: 0; }
.word-en {
    font-size: 16px;
    font-weight: 850;
    overflow-wrap: anywhere;
}

.word-ru {
    color: var(--muted);
    font-size: 12px;
    margin-top: 5px;
    overflow-wrap: anywhere;
}

.word-actions { display: flex; gap: 7px; flex-shrink: 0; }

.icon-btn {
    width: 35px;
    height: 35px;
    display: grid;
    place-items: center;
    border-radius: 11px;
    background: var(--panel3);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 14px;
}

.icon-btn:hover { color: var(--orange); border-color: #ff8a2466; }

.all-words-task {
    color: var(--orange2);
    font-size: 10px;
    margin-top: 5px;
}

.search-input {
    width: 100%;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 13px 15px;
    outline: none;
    margin-bottom: 16px;
}

.search-input:focus { border-color: #ff8a2470; }

.notice {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    background: #ff8a2410;
    border: 1px solid #ff8a242a;
    border-radius: 17px;
    padding: 16px;
    margin-top: 22px;
}

.notice-icon { font-size: 20px; }
.notice strong { display: block; font-size: 12px; margin-bottom: 5px; }
.notice p { color: var(--muted); font-size: 11px; line-height: 1.6; margin: 0; }

.mobile-nav { display: none; }

.modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    padding: 16px;
    background: #000b;
    backdrop-filter: blur(7px);
    animation: appear .18s ease;
}

.modal {
    width: min(100%,460px);
    max-height: 90vh;
    overflow-y: auto;
    background: #1b1c21;
    border: 1px solid #ffffff16;
    border-radius: 24px;
    padding: 24px;
    box-shadow: 0 25px 80px #0008;
}

.modal-head {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    align-items: center;
    margin-bottom: 20px;
}

.modal-head h2 { margin: 0; font-size: 20px; }

.close-btn {
    background: var(--panel3);
    color: var(--muted);
    border: 0;
    width: 34px;
    height: 34px;
    border-radius: 11px;
    font-size: 19px;
}

.field { margin-bottom: 15px; }
.field label {
    display: block;
    color: #c3c3ca;
    font-size: 11px;
    font-weight: 800;
    margin-bottom: 8px;
}

.field input, .field textarea {
    width: 100%;
    background: #111216;
    color: white;
    border: 1px solid #ffffff13;
    border-radius: 13px;
    padding: 13px 14px;
    outline: none;
}

.field input:focus, .field textarea:focus { border-color: var(--orange); }
.field textarea { resize: vertical; min-height: 80px; }

.field-note { color: var(--muted); font-size: 10px; margin-top: 6px; }

.form-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 21px; }

.toast {
    position: fixed;
    z-index: 40;
    left: 50%;
    bottom: 26px;
    transform: translate(-50%,20px);
    opacity: 0;
    pointer-events: none;
    background: #292a30;
    border: 1px solid #ffffff18;
    color: white;
    padding: 12px 19px;
    border-radius: 30px;
    font-size: 12px;
    font-weight: 750;
    box-shadow: 0 8px 30px #0008;
    transition: .25s;
    max-width: calc(100% - 30px);
    text-align: center;
}

.toast.show { opacity: 1; transform: translate(-50%,0); }

.footer-note {
    text-align: center;
    color: #656771;
    font-size: 10px;
    margin-top: 38px;
}

@media (max-width: 850px) {
    .sidebar { width: 210px; }
    .main { width: calc(100% - 210px); margin-left: 210px; padding: 27px 24px 55px; }
    .hero-decoration { margin-right: 5px; font-size: 80px; }
}

@media (max-width: 650px) {
    .sidebar { display: none; }
    .main {
        width: 100%;
        margin: 0;
        padding: 22px 16px calc(100px + env(safe-area-inset-bottom));
    }
    .topbar { margin-bottom: 22px; }
    .topbar h1 { font-size: 21px; }
    .hero { min-height: 230px; padding: 24px 21px; border-radius: 23px; }
    .hero h2 { font-size: 29px; }
    .hero p { font-size: 12px; max-width: 270px; }
    .hero-decoration { font-size: 60px; margin: 0; opacity: .65; }
    .stats { gap: 9px; margin: 16px 0 27px; }
    .stat-card { padding: 13px 11px; border-radius: 17px; }
    .stat-icon { width: 31px; height: 31px; font-size: 14px; border-radius: 10px; }
    .stat-number { font-size: 24px; margin-top: 10px; }
    .stat-label { font-size: 10px; }
    .task-grid { grid-template-columns: 1fr; gap: 10px; }
    .task-card { padding: 17px; }
    .detail-header h2 { font-size: 22px; }
    .word-card { padding: 13px; }
    .word-en { font-size: 14px; }
    .word-actions { gap: 5px; }
    .icon-btn { width: 32px; height: 32px; }
    .mobile-nav {
        display: grid;
        grid-template-columns: repeat(3,1fr);
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 10;
        padding: 9px 9px calc(9px + env(safe-area-inset-bottom));
        background: #17181ded;
        backdrop-filter: blur(18px);
        border-top: 1px solid var(--border);
    }
    .mobile-nav .nav-btn {
        padding: 8px 3px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        justify-content: center;
        align-items: center;
        font-size: 9px;
        border-radius: 12px;
    }
    .mobile-nav .nav-icon { font-size: 19px; }
    .local-badge { font-size: 9px; padding: 8px 10px; }
    .footer-note { margin-top: 25px; }
}

@media (max-width: 390px) {
    .hero-decoration { display: none; }
    .stats { grid-template-columns: repeat(3,minmax(0,1fr)); }
    .stat-number { font-size: 21px; }
    .local-badge { display: none; }
}

/* ENGLISHRUSH BOTTOM NAV PUFFY UI */

/* Общая атмосфера */

html {
    min-height: 100%;
    scroll-behavior: smooth;
}

body {
    background:
        radial-gradient(ellipse at 15% 0%, #ff8a240b, transparent 35%),
        radial-gradient(ellipse at 90% 100%, #ff8a2408, transparent 35%),
        var(--bg);
    overflow-x: hidden;
}

button {
    -webkit-tap-highlight-color: transparent;
    transition:
        transform .18s ease,
        background .18s ease,
        box-shadow .18s ease,
        border-color .18s ease;
}

/* Убираем боковую панель */

.sidebar {
    display: none !important;
}

/* Основная рабочая область */

.main {
    width: 100%;
    max-width: 1440px;
    margin: 0 auto;
    padding: 36px 44px 145px;
}

/* Нижняя плавающая навигация — ПК и телефон */

.mobile-nav {
    display: flex !important;
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 100;

    width: max-content;
    max-width: calc(100vw - 36px);

    padding: 9px;
    gap: 8px;

    background: rgba(27, 28, 34, .94);
    border: 1px solid rgba(255,255,255,.11);
    border-radius: 27px;

    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);

    box-shadow:
        0 15px 45px rgba(0,0,0,.45),
        0 4px 12px rgba(0,0,0,.25),
        inset 0 1px 0 rgba(255,255,255,.07);
}

.mobile-nav .nav-btn {
    display: flex !important;
    flex-direction: row !important;
    align-items: center;
    justify-content: center;

    width: auto;
    min-width: 145px;
    padding: 14px 19px;

    gap: 10px;
    border-radius: 19px;

    color: #a6a6b0;
    background: transparent;

    font-size: 13px;
    font-weight: 850;
}

.mobile-nav .nav-btn:hover {
    background: #ffffff0b;
    color: white;
}

.mobile-nav .nav-btn.active {
    color: #27180c;
    background: linear-gradient(145deg, #ffb35e, #ff851e);

    box-shadow:
        0 5px 17px #ff8a2440,
        inset 0 1px 0 #ffffff60;
}

.mobile-nav .nav-icon {
    width: auto;
    font-size: 21px;
    line-height: 1;
}

.mobile-nav .nav-btn span:last-child {
    white-space: nowrap;
}

/* Более объёмная главная панель */

.hero {
    min-height: 270px;
    padding: 42px;
    border-radius: 34px;

    background:
        radial-gradient(circle at 90% 15%, #ff9c4a42, transparent 39%),
        linear-gradient(130deg, #392319, #251a17 60%, #302016);

    border: 1px solid #ffad5730;

    box-shadow:
        0 18px 45px rgba(0,0,0,.20),
        inset 0 1px 0 rgba(255,255,255,.08);
}

.hero h2 {
    font-size: clamp(31px, 4vw, 45px);
    font-weight: 950;
}

.hero-decoration {
    filter: drop-shadow(0 15px 23px #0008);
}

/* Объёмные статистические карточки */

.stats {
    gap: 17px;
}

.stat-card {
    padding: 23px;
    border-radius: 26px;

    background: linear-gradient(145deg, #202127, #17181d);

    border: 1px solid rgba(255,255,255,.075);

    box-shadow:
        0 9px 22px rgba(0,0,0,.18),
        inset 0 1px 0 rgba(255,255,255,.045);
}

.stat-card:hover {
    transform: translateY(-4px);
    border-color: #ff9a3855;
    box-shadow: 0 13px 28px #0005;
}

.stat-icon {
    width: 43px;
    height: 43px;
    border-radius: 16px;
    font-size: 19px;
    background: linear-gradient(145deg, #ff98252a, #ff98250c);
}

.stat-number {
    font-size: 33px;
    font-weight: 950;
}

/* Карточки заданий */

.task-grid {
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 17px;
}

.task-card {
    padding: 23px;
    border-radius: 25px;

    background: linear-gradient(145deg, #202127, #191a1f);

    border: 1px solid rgba(255,255,255,.075);

    box-shadow:
        0 9px 22px rgba(0,0,0,.17),
        inset 0 1px 0 rgba(255,255,255,.045);
}

.task-card:hover {
    transform: translateY(-5px);
    border-color: #ff922d66;
    box-shadow: 0 15px 30px #0006;
}

.task-symbol {
    width: 49px;
    height: 49px;
    border-radius: 17px;
}

/* Объёмные кнопки */

.primary-btn,
.secondary-btn,
.danger-btn {
    min-height: 45px;
    padding: 13px 21px;
    border-radius: 17px;
    font-weight: 900;
}

.primary-btn {
    background: linear-gradient(145deg, #ffb15a, #ff811b);
    box-shadow:
        0 6px 17px #ff832b30,
        inset 0 1px 0 #ffffff65;
}

.primary-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px #ff832b40;
}

.primary-btn:active {
    transform: scale(.96);
}

.secondary-btn {
    background: linear-gradient(145deg, #30313a, #22232a);
    border: 1px solid #ffffff12;
    box-shadow: 0 5px 12px #0003;
}

.secondary-btn:active {
    transform: scale(.96);
}

.danger-btn {
    border-radius: 17px;
}

/* ENGLISHRUSH LEARNING UI */

.hero-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 11px;
}

.study-page {
    width: 100%;
    max-width: 820px;
    margin: 0 auto;
    animation: appear .25s ease;
}

.study-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 17px;
}

.study-scope {
    color: var(--muted);
    font-size: 12px;
    font-weight: 750;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.study-counter {
    color: var(--orange2);
    font-size: 13px;
    font-weight: 900;
    white-space: nowrap;
}

.study-progress {
    width: 100%;
    height: 8px;
    margin-bottom: 23px;
    border-radius: 20px;
    background: #292a30;
    overflow: hidden;
}

.study-progress-fill {
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, #ff7919, #ffb45b);
    transition: width .35s ease;
}

.study-card {
    min-height: 340px;
    padding: 48px 32px;
    border: 1px solid #ffffff12;
    border-radius: 32px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;

    background:
        radial-gradient(ellipse at 50% 0%, #ff92201c, transparent 60%),
        linear-gradient(145deg, #24252d, #191a20);

    box-shadow:
        0 16px 36px #0004,
        inset 0 1px 0 #ffffff0b;

    animation: studyEnter .3s ease;
}

@keyframes studyEnter {
    from { opacity: 0; transform: translateY(10px) scale(.99); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

.study-card.is-revealed {
    border-color: #ff9c3850;
    background:
        radial-gradient(ellipse at 50% 0%, #ff92202a, transparent 65%),
        linear-gradient(145deg, #29252a, #1c1b20);
}

.study-kicker,
.study-answer-label {
    color: var(--muted);
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 1.5px;
}

.study-word {
    margin-top: 27px;
    font-size: clamp(37px, 7vw, 61px);

    letter-spacing: -1.7px;
    font-weight: 950;
    overflow-wrap: anywhere;
}

    width: 52px;

    background: var(--orange);
}

    color: var(--muted);

}

.study-answer-label {
    color: var(--orange2);
}

.study-translation {
    margin-top: 12px;
    font-size: clamp(23px, 4vw, 31px);
    font-weight: 850;
    line-height: 1.3;
    overflow-wrap: anywhere;
    animation: studyEnter .25s ease;
}

.study-actions {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 11px;
    margin-top: 23px;
}

.study-main-action {
    min-width: 220px;
}

}

    font-weight: 750;
    margin-top: 25px;
    margin-bottom: 12px;
}

.study-ratings {

    grid-template-columns: repeat(3, minmax(0,1fr));
    gap: 11px;
}

    font-weight: 900;

}

    color: #91e0b2;
}

.rate-easy {

    border-color: #80baff30;
    color: #9acbff;
}

.study-feedback {
    width: 100%;

    font-size: 12px;
    line-height: 1.6;
}

.study-footnote {

    border-radius: 15px;

    margin: 12px 0 22px;
    font-size: 13px;
    color: var(--muted);
}

.study-result strong {
    color: white;

@media (max-width: 650px) {
    .hero-actions {
        display: grid;
        grid-template-columns: 1fr;
    }

        width: 100%;

        width: 100%;
    }

    .study-actions {
        gap: 9px;
    }

    .study-empty {
        min-height: 300px;

    }

const toastElement = document.getElementById("toast");

const UI_ICONS = {
    home: '<path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9"/><path d="M9 20v-7h6v7"/>',
    tasks: '<rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/>',
    book: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21z"/><path d="M4 5.5v15.5M8 7h8M8 11h7"/>',
    layers: '<path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/>',
    award: '<circle cx="12" cy="8" r="5"/><path d="m8.5 12-1 9 4.5-3 4.5 3-1-9"/>',
    folder: '<path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
    bulb: '<path d="M9 18h6M10 22h4"/><path d="M8.5 14.5a7 7 0 1 1 7 0c-.8.6-1.5 1.5-1.5 2.5h-4c0-1-.7-1.9-1.5-2.5Z"/>',
    search: '<circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/>',
    edit: '<path d="m15 5 4 4"/><path d="M4 20h4l11-11a2.8 2.8 0 0 0-4-4L4 16z"/>',
    close: '<path d="m18 6-12 12M6 6l12 12"/>',

};

function uiIcon(name, size = 22) {
    const iconSize = Math.max(12, Math.min(100, Number(size) || 22));

    return `<svg class="ui-icon"
        width="${iconSize}" height="${iconSize}"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true">${UI_ICONS[name] || UI_ICONS.book}</svg>`;
}
function loadState() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredCloneSafe(defaultState);

        const data = JSON.parse(raw);

        if (!data || !Array.isArray(data.tasks)) {
            throw new Error("Invalid saved data");
        }

        return {
            version: 1,
            tasks: data.tasks.map(task => ({
                ...task,
                words: Array.isArray(task.words) ? task.words : []
            }))
        };
    } catch (error) {
        console.error("EnglishRush storage error:", error);
        return structuredCloneSafe(defaultState);
    }
}

function structuredCloneSafe(value) {
    return JSON.parse(JSON.stringify(value));
}

function saveState() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        return true;
    } catch (error) {
        console.error("Could not save data:", error);
        showToast("Не удалось сохранить данные. Проверьте память устройства.");
        return false;
    }
}

function makeId() {
    if (window.crypto && crypto.randomUUID) {
        return crypto.randomUUID();
    }

    return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function getTask(taskId) {
    return state.tasks.find(task => task.id === taskId);
}

function getAllWords() {
    return state.tasks.flatMap(task =>
        task.words.map(word => ({
            ...word,
            taskId: task.id,
            taskName: task.name
        }))
    );
}

function getStats() {
    const words = getAllWords();
    const now = Date.now();

    const learned = words.filter(
        word => word.mastered === true
    ).length;

    const reviews = words.reduce((sum, word) => {
        return sum + Math.max(
            0,
            Math.floor(Number(word.learning?.reviewCount) || 0)
        );
    }, 0);

    const due = words.filter(word => {
        const dueAt = word.learning?.dueAt;

        if (!dueAt) return true;

        const dueTime = Date.parse(dueAt);

        return !Number.isFinite(dueTime) || dueTime <= now;
    }).length;

    const difficult = words.filter(word => {
        return Number(word.learning?.lapses) > 0;
    }).length;

    return {
        tasks: state.tasks.length,
        words: words.length,
        learned,
        reviews,
        due,
        difficult,
        progress: words.length
            ? Math.round(learned / words.length * 100)
            : 0
    };
}
function formatDate(dateString) {
    if (!dateString) return "";
    const date = new Date(dateString);
    if (Number.isNaN(date.getTime())) return "";
    return new Intl.DateTimeFormat("ru-RU", {
        day: "numeric",
        month: "short",
        year: "numeric"
    }).format(date);
}

function showToast(message) {
    toastElement.textContent = message;
    toastElement.classList.add("show");

    clearTimeout(showToast.timeout);
    showToast.timeout = setTimeout(() => {
        toastElement.classList.remove("show");
    }, 2600);
}

}

                data-action="navigate" data-view="${view}">
            <span class="nav-icon">${icon}</span>
            <span>${label}</span>
        </button>`;
}

}

        home: ["ТВОЁ ПРОСТРАНСТВО", "Главная"],

    };

}

// ENGLISHRUSH LEARNING ENGINE

function ensureWordLearning(word) {
    const now = new Date().toISOString();

    if (
        !word.learning ||
        typeof word.learning !== "object" ||
        Array.isArray(word.learning)
    ) {
        word.learning = {
            reviewCount: 0,
            successfulReviews: 0,
            lapses: 0,
            repetitions: 0,
            easeFactor: 2.3,
            intervalDays: 0,
            dueAt: word.createdAt || now,
            lastReviewedAt: null,
            algorithmVersion: 2
        };
    }

    const progress = word.learning;

    // Старую общую статистику сохраняем,
    // но не считаем её последовательными успехами.
    if (progress.algorithmVersion !== 2) {
        progress.repetitions = 0;
        progress.easeFactor = 2.3;
        progress.algorithmVersion = 2;
    }

    progress.reviewCount = Math.max(
        0, Math.floor(Number(progress.reviewCount) || 0)
    );

    progress.successfulReviews = Math.max(
        0, Math.floor(Number(progress.successfulReviews) || 0)
    );

    progress.lapses = Math.max(
        0, Math.floor(Number(progress.lapses) || 0)
    );

    progress.repetitions = Math.max(
        0, Math.floor(Number(progress.repetitions) || 0)
    );

    progress.intervalDays = Math.max(
        0, Number(progress.intervalDays) || 0
    );

    const easeFactor = Number(progress.easeFactor);

    progress.easeFactor = Number.isFinite(easeFactor)
        ? Math.min(3.0, Math.max(1.3, easeFactor))
        : 2.3;

    if (!progress.dueAt) {
        progress.dueAt = word.createdAt || now;
    }

    return progress;
}

function getStudyEntries(taskId = null) {
    const selectedTasks = taskId
        ? [getTask(taskId)].filter(Boolean)
        : state.tasks;

    return selectedTasks.flatMap(task =>
        task.words
            .filter(word => word && word.id && word.english && word.russian)
            .map(word => ({
                taskId: task.id,
                wordId: word.id,
                taskName: task.name
            }))
    );
}

function getStudyWord(entry) {
    if (!entry) return null;

    const task = getTask(entry.taskId);

    if (!task) return null;

    return task.words.find(word => word.id === entry.wordId) || null;
}

function getWordDueTime(word) {
    const progress = ensureWordLearning(word);
    const time = Date.parse(progress.dueAt);

    return Number.isFinite(time) ? time : 0;
}

function formatReviewDate(timestamp) {
    if (!timestamp) return "";

    return new Intl.DateTimeFormat("ru-RU", {
        day: "numeric",
        month: "long",
        hour: "2-digit",
        minute: "2-digit"
    }).format(new Date(timestamp));
}

function startStudy(taskId = null, mode = "scheduled") {
    const selectedTask = taskId ? getTask(taskId) : null;

    if (taskId && !selectedTask) {
        showToast("Задание не найдено");
        return;
    }

    const isPractice = mode === "practice";
    const entries = getStudyEntries(taskId);
    const now = Date.now();

    // В обычном режиме подготавливаем интервальные данные.
    // В режиме повторения не изменяем сохранённый прогресс.
    if (!isPractice) {
        entries.forEach(entry => {
            const word = getStudyWord(entry);
            if (word) ensureWordLearning(word);
        });
    }

    const studyEntries = isPractice
        ? entries.filter(entry => getStudyWord(entry))
        : entries
            .filter(entry => {
                const word = getStudyWord(entry);
                return word && getWordDueTime(word) <= now;
            })
            .sort((a, b) => {
                return getWordDueTime(getStudyWord(a)) -
                       getWordDueTime(getStudyWord(b));
            });

    const studyCards = studyEntries.map(entry => ({
        taskId: entry.taskId,
        wordId: entry.wordId
    }));

    studySession = {
        mode: isPractice ? "practice" : "scheduled",
        scopeTaskId: taskId,
        scopeLabel: selectedTask ? selectedTask.name : "Все задания",
        returnView: currentView,
        returnTaskId: currentTaskId,
        cards: studyCards,
        cursor: 0,
        retryQueue: [],
        completed: 0,
        firstPassCompleted: 0,
        retryCompleted: 0,
        total: studyCards.length,
        displays: {},
        current: null,
        revealed: false,
        pendingRating: null
    };

    currentView = "study";
    currentTaskId = null;
    modal = null;

    if (!isPractice) {
        saveState();
    }

    if (studyCards.length > 0) {
        nextStudyCard();
    }

    render();
}
function nextStudyCard() {
    if (!studySession) return;

    const session = studySession;
    let next = null;
    let isRetry = false;

    // Сначала заканчиваем первое прохождение всех слов.
    if (session.cursor < session.cards.length) {
        next = session.cards[session.cursor++];
    } else {
        // После первого прохода работаем с очередью повторов.
        const readyRetry = session.retryQueue.findIndex(
            item => item.afterCompleted <= session.completed
        );

        if (readyRetry >= 0) {
            next = session.retryQueue.splice(readyRetry, 1)[0];
            isRetry = true;
        } else if (session.retryQueue.length > 0) {
            // Если других карточек нет, не оставляем
            // тренировку заблокированной ожиданием.
            next = session.retryQueue.shift();
            isRetry = true;
        }
    }

    session.current = next
        ? {
            taskId: next.taskId,
            wordId: next.wordId,
            isRetry,
            direction: "en-ru"
        }
        : null;

    session.revealed = false;
    session.pendingRating = null;

    if (next) {
        const displayKey = `${next.taskId}:${next.wordId}`;
        const displayCount = session.displays[displayKey] || 0;

        // Меняем направление при каждом новом показе слова.
        session.current.direction = displayCount % 2 === 0
            ? "ru-en"
            : "en-ru";

        session.displays[displayKey] = displayCount + 1;
    }
}

function revealStudyAnswer(unknown = false) {
    if (!studySession || !studySession.current) return;

    studySession.revealed = true;
    studySession.pendingRating = unknown ? "again" : null;

    render();
}

function rateCurrentStudyWord(rating) {
    if (!studySession || !studySession.current) return;

    const allowedRatings = ["again", "hard", "good", "easy"];

    if (!allowedRatings.includes(rating)) return;

    const session = studySession;
    const entry = session.current;
    const word = getStudyWord(entry);

    if (!word) {
        session.completed += 1;

        if (entry.isRetry) {
            session.retryCompleted += 1;
        } else {
            session.firstPassCompleted += 1;
        }

        nextStudyCard();
        render();
        return;
    }

    // Тренировочный режим не меняет сохранённую статистику,
    // расписание повторений или статус освоения слова.
    if (session.mode !== "practice") {
        const progress = ensureWordLearning(word);
        const now = Date.now();
        const previousInterval = progress.intervalDays;

        progress.reviewCount += 1;
        progress.lastReviewedAt = new Date(now).toISOString();

        if (rating === "again") {
            progress.lapses += 1;
            progress.repetitions = 0;
            progress.intervalDays = 0;

            progress.easeFactor = Math.max(
                1.3,
                Math.round((progress.easeFactor - 0.2) * 100) / 100
            );

            progress.dueAt = new Date(
                now + 10 * 60 * 1000
            ).toISOString();

            word.mastered = false;
        } else {
            progress.successfulReviews += 1;

            const repetitions = progress.repetitions;
            let nextInterval;

            if (rating === "hard") {
                progress.easeFactor = Math.max(
                    1.3,
                    Math.round((progress.easeFactor - 0.15) * 100) / 100
                );

                nextInterval = repetitions === 0
                    ? 0.5
                    : repetitions === 1
                        ? 1
                        : Math.max(1, Math.round(previousInterval * 1.2));

            } else if (rating === "good") {
                nextInterval = repetitions === 0
                    ? 1
                    : repetitions === 1
                        ? 3
                        : Math.max(
                            1,
                            Math.round(previousInterval * progress.easeFactor)
                        );

            } else {
                progress.easeFactor = Math.min(
                    3.0,
                    Math.round((progress.easeFactor + 0.15) * 100) / 100
                );

                nextInterval = repetitions === 0
                    ? 4
                    : repetitions === 1
                        ? 7
                        : Math.max(
                            2,
                            Math.round(previousInterval * (progress.easeFactor + 0.3))
                        );
            }

            progress.repetitions += 1;
            progress.intervalDays = Math.min(365, nextInterval);

            progress.dueAt = new Date(
                now + progress.intervalDays * 24 * 60 * 60 * 1000
            ).toISOString();

            word.mastered =
                progress.repetitions >= 3 &&
                progress.intervalDays >= 7;
        }
    }

    session.completed += 1;

    if (entry.isRetry) {
        session.retryCompleted += 1;
    } else {
        session.firstPassCompleted += 1;
    }

    // В режиме повторения возвращаем в очередь и сложные слова.
    if (
        rating === "again" ||
        (session.mode === "practice" && rating === "hard")
    ) {
        session.retryQueue.push({
            taskId: entry.taskId,
            wordId: entry.wordId,
            afterCompleted: session.completed + 2
        });
    }

    // Сохраняем изменения только при обычном интервальном обучении.
    if (session.mode !== "practice") {
        saveState();
    }

    nextStudyCard();
    render();
}
function exitStudy() {
    if (!studySession) {
        currentView = "home";
        render();
        return;
    }

    const destination = studySession.returnView || "home";
    const destinationTask = studySession.returnTaskId;

    studySession = null;
    currentView = destination;
    currentTaskId = destinationTask || null;

    render();
}

function getNextReviewTime(taskId = null) {
    const entries = getStudyEntries(taskId);
    const now = Date.now();

    const futureTimes = entries
        .map(entry => {
            const word = getStudyWord(entry);
            return word ? getWordDueTime(word) : 0;
        })
        .filter(time => time > now)
        .sort((a, b) => a - b);

    return futureTimes.length ? futureTimes[0] : null;
}

function renderStudy() {
    const session = studySession;

    if (!session) {
        return `
            <section class="study-page">
                <div class="study-empty">
                    <h2>Обучение завершено</h2>
                    <button class="primary-btn" data-action="exit-study">Вернуться</button>
                </div>
            </section>`;
    }

    const entries = getStudyEntries(session.scopeTaskId);
    const word = getStudyWord(session.current);

    if (!word) {
        const nextTime = getNextReviewTime(session.scopeTaskId);

        if (session.total > 0) {
            return `
                <section class="study-page">
                    <div class="study-empty">
                        <div class="study-complete-mark">${uiIcon("award", 34)}</div>
                        <h2>Отличная работа!</h2>
                        <p>${session.mode === "practice" ? "Тренировка завершена. Прогресс обучения не изменён." : "Повторение завершено."}</p>
                        <div class="study-result">
                            Первый проход: <strong>${session.firstPassCompleted} / ${session.total}</strong>
                            <br>
                            Дополнительных повторений: <strong>${session.retryCompleted}</strong>
                        </div>
                        <button class="primary-btn" data-action="exit-study">
                            Вернуться
                        </button>
                    </div>
                </section>`;
        }

        const emptyTitle = entries.length
            ? "Пока всё повторено"
            : "Здесь пока нет слов";

        const emptyDescription = entries.length
            ? nextTime
                ? `Следующее повторение: ${formatReviewDate(nextTime)}`
                : "Сейчас нет слов, ожидающих повторения."
            : "Добавь слова в задание, чтобы начать обучение.";

        return `
            <section class="study-page">
                <div class="study-empty">
                    <div class="study-complete-mark">${uiIcon("book", 32)}</div>
                    <h2>${emptyTitle}</h2>
                    <p>${emptyDescription}</p>
                    <button class="primary-btn" data-action="exit-study">
                        Вернуться
                    </button>
                </div>
            </section>`;
    }

    const isRetry = session.current.isRetry === true;
    const isReverse = session.current.direction === "ru-en";

    const counterText = isRetry
        ? `Повтор ${session.retryCompleted + 1}`
        : `${Math.min(session.firstPassCompleted + 1, session.total)} / ${session.total}`;

    const percentage = Math.min(
        100,
        Math.round(session.firstPassCompleted / session.total * 100)
    );

    return `
        <section class="study-page">

            <div class="study-toolbar">
                <button class="back-btn" data-action="exit-study">
                    ← Назад
                </button>
                <span class="study-scope">${escapeHtml(session.scopeLabel)}</span>
                <span class="study-counter">${counterText}</span>
            </div>

            <div class="study-progress">
                <div class="study-progress-fill" style="width:${percentage}%"></div>
            </div>

            <div class="study-stage-note">
                ${session.mode === "practice"
                    ? "Режим повторения. Прогресс и расписание не изменяются."
                    : isRetry
                        ? "Первый проход завершён. Закрепляем сложные слова."
                        : "Первое прохождение. Вспомни перевод до показа ответа."}
            </div>

            <div class="study-card ${session.revealed ? "is-revealed" : ""}">

                <div class="study-kicker">
                    ${isReverse ? "ПЕРЕВЕДИ НА АНГЛИЙСКИЙ" : "ПЕРЕВЕДИ НА РУССКИЙ"}
                </div>

                <div class="study-word">
                    ${escapeHtml(isReverse ? word.russian : word.english)}
                </div>

                <div class="study-divider"></div>

                ${
                    session.revealed
                        ? `
                            <div class="study-answer-label">ПРАВИЛЬНЫЙ ОТВЕТ</div>
                            <div class="study-translation">
                                ${escapeHtml(isReverse ? word.english : word.russian)}
                            </div>`
                        : `
                            <div class="study-hint">
                                Вспомни перевод самостоятельно
                            </div>`
                }

            </div>

            ${
                !session.revealed
                    ? `
                        <div class="study-actions">
                            <button class="primary-btn study-main-action"
                                    data-action="study-reveal">
                                Показать перевод
                            </button>

                            <button class="secondary-btn study-unknown-action"
                                    data-action="study-dont-know">
                                Не знаю
                            </button>
                        </div>`
                    : session.pendingRating === "again"
                        ? `
                            <div class="study-actions">
                                <div class="study-feedback">
                                    Правильный ответ показан. Слово скоро повторится.
                                </div>
                                <button class="primary-btn study-main-action"
                                        data-action="study-continue">
                                    Понятно, продолжить
                                </button>
                            </div>`
                        : `
                            <div class="study-rating-title">
                                Насколько хорошо ты вспомнил слово?
                            </div>

                            <div class="study-ratings">
                                <button class="study-rate rate-hard"
                                        data-action="study-rate"
                                        data-rating="hard">Трудно</button>

                                <button class="study-rate rate-good"
                                        data-action="study-rate"
                                        data-rating="good">Помню</button>

                                <button class="study-rate rate-easy"
                                        data-action="study-rate"
                                        data-rating="easy">Легко</button>
                            </div>`
            }

            <div class="study-footnote">
                ${session.current.isRetry
                    ? "Это дополнительное повторение для закрепления слова."
                    : session.retryQueue.length
                        ? "Сложные слова вернутся после нескольких карточек."
                        : "Твой прогресс сохраняется автоматически."}
            </div>

        </section>`;
}

function render() {
    let content = "";

    if (currentView === "home") content = renderHome();
    if (currentView === "tasks") content = renderTasks();
    if (currentView === "detail") content = renderTaskDetail();
    if (currentView === "words") content = renderAllWords();
    if (currentView === "study") content = renderStudy();

    app.innerHTML = `
        <div class="app">
            ${renderNavigation()}
            <main class="main">
                ${renderHeader()}
                ${content}
                <div class="footer-note">ENGLISHRUSH · YOUR PERSONAL VOCABULARY SPACE</div>
            </main>
        </div>
        ${renderModal()}`;
}

}

function openModal(type, data = {}) {
    modal = { type, ...data };
    render();

    requestAnimationFrame(() => {
        const firstInput = app.querySelector(".modal input");
        if (firstInput) firstInput.focus();
    });
}

function closeModal() {
    modal = null;
    render();
}

function deleteTask(taskId) {
    const task = getTask(taskId);
    if (!task) return;

    const accepted = confirm(
        `Удалить задание "${task.name}" и все ${task.words.length} слов внутри него?`
    );

    if (!accepted) return;

    state.tasks = state.tasks.filter(item => item.id !== taskId);
    saveState();

    if (currentTaskId === taskId) {
        currentView = "tasks";
        currentTaskId = null;
    }

    if (studySession && studySession.scopeTaskId === taskId) {
        studySession = null;
        currentView = "tasks";
        currentTaskId = null;
    }

    if (modal && modal.taskId === taskId) {
        modal = null;
    }

    render();
    showToast("Задание и его слова удалены");
}
function deleteWord(taskId, wordId) {
    const task = getTask(taskId);
    if (!task) return;

    const word = task.words.find(item => item.id === wordId);
    if (!word) return;

    if (!confirm(`Удалить слово "${word.english}"?`)) return;

    task.words = task.words.filter(item => item.id !== wordId);
    saveState();
    render();
    showToast("Слово удалено");
}

app.addEventListener("click", event => {
    const button = event.target.closest("[data-action]");
    if (!button) return;

    const action = button.dataset.action;
    const id = button.dataset.id;
    const taskId = button.dataset.taskId;

    if (action === "navigate") {
        setView(button.dataset.view);
        return;
    }

    if (action === "new-task") {
        openModal("task");
        return;
    }

    if (action === "open-task") {
        currentTaskId = id;
        currentView = "detail";
        render();
        return;
    }

        if (action === "start-study-all") {
        startStudy();
        return;
    }

    if (action === "start-study-task") {
        startStudy(taskId);
        return;
    }
        if (action === "repeat-study-task") {
            startStudy(taskId, "practice");
            return;
        }

    if (action === "study-reveal") {
        revealStudyAnswer(false);
        return;
    }

    if (action === "study-dont-know") {
        revealStudyAnswer(true);
        return;
    }

    if (action === "study-continue") {
        rateCurrentStudyWord("again");
        return;
    }

    if (action === "study-rate") {
        rateCurrentStudyWord(button.dataset.rating);
        return;
    }

    if (action === "exit-study") {
        exitStudy();
        return;
    }
if (action === "edit-task") {
        openModal("task", { taskId: id });
        return;
    }

    if (action === "new-word") {
        openModal("word", { taskId });
        return;
    }

    if (action === "edit-word") {
        openModal("word", { taskId, wordId: id });
        return;
    }

    if (action === "delete-word") {
        deleteWord(taskId, id);
        return;
    }

    if (action === "delete-task") {
        deleteTask(id);
        return;
    }

    if (action === "close-modal") {
        closeModal();
        return;
    }

    if (action === "backdrop-close" && event.target === button) {
        closeModal();
    }
});

app.addEventListener("submit", event => {
    const form = event.target;
    if (form.id !== "task-form" && form.id !== "word-form") return;

    event.preventDefault();

    const formData = new FormData(form);

    if (form.id === "task-form") {
        const name = String(formData.get("name") || "").trim();
        const description = String(formData.get("description") || "").trim();
        const taskId = form.dataset.id;

        if (!name) {
            showToast("Введи название задания");
            return;
        }

        if (taskId) {
            const task = getTask(taskId);
            if (!task) return;

            task.name = name;
            task.description = description;
            showToast("Задание обновлено");
        } else {
            state.tasks.push({
                id: makeId(),
                name,
                description,
                createdAt: new Date().toISOString(),
                words: []
            });
            showToast("Задание создано");
        }

        saveState();
        modal = null;
        render();
        return;
    }

    if (form.id === "word-form") {
        const task = getTask(form.dataset.taskId);
        if (!task) return;

        const english = String(formData.get("english") || "").trim();
        const russian = String(formData.get("russian") || "").trim();
        const wordId = form.dataset.id;

        if (!english || !russian) {
            showToast("Заполни оба поля");
            return;
        }

        const duplicate = task.words.find(word =>
            word.english.toLowerCase() === english.toLowerCase() &&
            word.id !== wordId
        );

        if (duplicate) {
            showToast("Это слово уже есть в данном задании");
            return;
        }

        if (wordId) {
            const word = task.words.find(item => item.id === wordId);
            if (!word) return;

            word.english = english;
            word.russian = russian;
            word.updatedAt = new Date().toISOString();
            showToast("Слово обновлено");
        } else {
            task.words.push({
                id: makeId(),
                english,
                russian,
                createdAt: new Date().toISOString(),
                mastered: false
            });
            showToast("Слово добавлено");
        }

        saveState();
        modal = null;
        render();
    }
});

app.addEventListener("input", event => {
    if (event.target.id !== "word-search") return;

    const input = event.target;
    const cursor = input.selectionStart;

    searchQuery = input.value;
    const list = input.closest(".view").querySelector(".word-list");
    const words = getAllWords();
    const query = searchQuery.trim().toLowerCase();

    const filtered = words.filter(word =>
        word.english.toLowerCase().includes(query) ||
        word.russian.toLowerCase().includes(query) ||
        word.taskName.toLowerCase().includes(query)
    );

    list.innerHTML = filtered.length
        ? filtered.map(word => renderWordCard(word, word.taskName, word.taskId)).join("")
        : `<div class="empty">
             <div class="empty-icon">${uiIcon("search", 39)}</div>
             <h3>Ничего не найдено</h3>
             <p>Попробуй изменить поисковый запрос.</p>
           </div>`;

    if (document.activeElement === input) {
        input.setSelectionRange(cursor, cursor);
    }
});

document.addEventListener("keydown", event => {
    if (event.key === "Escape" && modal) closeModal();
});

window.addEventListener("storage", event => {
    if (event.key === STORAGE_KEY) {
        state = loadState();
        render();
        showToast("Данные обновлены");
    }
});

render();
</script>
